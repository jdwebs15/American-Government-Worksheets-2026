<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Founding Documents Building Depth</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><section class="panel"><p class="muted">AMERICAN GOVERNMENT · INTRODUCTION</p><h1>Founding Documents Building Depth</h1><p>40 multiple-choice questions · Correct answers advance automatically · Sources and Where to Look included.</p></section><section id="setup" class="panel"><h2>Student information</h2><div class="grid"><div><label for="name">Student name</label><input id="name" autocomplete="name"></div><div><label for="period">Class period</label><select id="period"><option value="">Select period</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div></div><label for="email">School email</label><input id="email" type="email"><p><button id="start">Start new attempt</button><button id="resume">Load previous progress</button></p></section><section id="game" class="panel hidden"><p id="progress" class="muted"></p><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p><div class="sources"><strong>Where to look:</strong> <span id="where"></span><p><a id="source" href="#" target="_blank" rel="noopener noreferrer">Source</a></p></div><p><button id="save">Save progress</button><button id="reset">Reset</button></p></section><section id="finish" class="panel hidden"><h2>Completion Ticket</h2><div id="ticket" class="ticket"></div><p id="sendstatus" class="muted"></p><button onclick="window.print()">Print ticket</button></section></main><script src="app.js"></script></body></html>
